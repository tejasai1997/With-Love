<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NidhiAyurvedic – Handmade Ayurvedic Soaps</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #FAF6EF; --sand: #E8D9C0; --clay: #C4855A;
    --brown: #6B3E26; --olive: #7A8C5E; --text: #3A2A1A; --light: #FFF9F3;
  }
  body { background: var(--cream); color: var(--text); font-family: 'Lato', sans-serif; line-height: 1.6; overflow-x: hidden; }
  nav { background: var(--light); border-bottom: 1px solid var(--sand); display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; position: sticky; top: 0; z-index: 100; }
  .brand { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--brown); letter-spacing: 1px; }
